<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEGA Caps | Make England Great Again</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .logo {
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: -2px;
            margin-bottom: 0.5rem;
            background: linear-gradient(45deg, #ff0000, #ffffff, #0000ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .tagline {
            font-size: 1.5rem;
            color: #ccc;
            margin-bottom: 2rem;
        }
        .caps-preview {
            width: 200px;
            height: 200px;
            background: #ff0000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
            margin: 2rem 0;
            box-shadow: 0 20px 60px rgba(255, 0, 0, 0.3);
            transform: rotate(-5deg);
        }
        .coming-soon {
            font-size: 1.2rem;
            color: #888;
            margin-top: 2rem;
        }
        .notify {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: #ff0000;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .notify:hover {
            transform: scale(1.05);
        }
        footer {
            margin-top: 4rem;
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="logo">MEGA</div>
    <div class="tagline">Make England Great Again</div>
    
    <div class="caps-preview">MEGA</div>
    
    <h2>Premium Quality Caps</h2>
    <p class="coming-soon">Coming Soon • White Label • Dropship Ready</p>
    
    <button class="notify">Notify Me When Live</button>
    
    <footer>
        &copy; 2026 MEGA Caps • megacaps.co.uk
    </footer>
</body>
</html>
