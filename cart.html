<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | MEGA Caps</title>
    <meta name="description" content="Review your MEGA Caps order. Premium quality caps celebrating English pride.">
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="site.webmanifest">
    <link rel="stylesheet" href="css/style.css">
    <script defer data-domain="megacaps.co.uk" src="https://plausible.io/js/script.js"></script>
</head>
<body>
    <!-- Header -->
    <header class="site-header" id="siteHeader">
        <div class="container">
            <a href="index.html" class="site-header__logo">MEGA</a>
            <nav>
                <ul class="site-nav">
                    <li><a href="index.html">Shop</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="cart.html" class="cart-link">Cart <span class="cart-count" style="display:none">0</span></a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Cart -->
    <section class="cart">
        <div class="container">
            <h1 class="cart__heading">Your Cart</h1>

            <!-- Empty state -->
            <div id="cart-empty" class="cart__empty">
                <p>Your cart is empty.</p>
                <p><a href="index.html#products" class="hero__cta" style="margin-top:1rem;display:inline-block">Continue Shopping</a></p>
            </div>

            <!-- Cart table -->
            <div id="cart-table-wrap" style="display:none">
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Qty</th>
                            <th>Total</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="cart-body">
                        <!-- JS populates this -->
                    </tbody>
                </table>

                <p id="cart-total" class="cart__total">Total: &pound;0.00</p>

                <button id="checkout-btn" class="cart__checkout-btn">
                    Proceed to Checkout
                </button>
                <div style="clear:both"></div>

                <p style="margin-top:1rem;text-align:right">
                    <a href="index.html#products" style="color:var(--text-light)">&larr; Continue Shopping</a>
                </p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <div class="site-footer__logo">MEGA</div>
            <nav class="site-footer__links">
                <a href="faq.html">FAQ</a>
                <a href="about.html">About</a>
                <a href="press.html">Press Kit</a>
                <a href="returns.html">Returns</a>
                <a href="terms.html">Terms</a>
                <a href="privacy.html">Privacy</a>
            </nav>
            <div class="site-footer__copyright">
                &copy; 2026 MEGA Caps &bull; megacaps.co.uk
            </div>
        </div>
    </footer>

    <script src="js/shop.js"></script>
</body>
</html>
