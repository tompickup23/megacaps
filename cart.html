<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | MEGA Caps</title>
    <meta name="description" content="Review your MEGA Caps order. Premium quality caps celebrating English pride.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header -->
    <header class="site-header">
        <div class="container">
            <a href="index.html" class="site-header__logo">MEGA</a>
            <nav>
                <ul class="site-nav">
                    <li><a href="index.html">Shop</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="cart.html" class="cart-link">Cart <span class="cart-count" style="display:none">0</span></a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Cart -->
    <section class="cart">
        <div class="container">
            <h1 class="cart__heading">Your Cart</h1>

            <!-- Empty state -->
            <div id="cart-empty" class="cart__empty">
                <p>Your cart is empty.</p>
                <p><a href="index.html#products" class="hero__cta" style="margin-top:1rem;display:inline-block">Continue Shopping</a></p>
            </div>

            <!-- Cart table -->
            <div id="cart-table-wrap" style="display:none">
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Qty</th>
                            <th>Total</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="cart-body">
                        <!-- JS populates this -->
                    </tbody>
                </table>

                <p id="cart-total" class="cart__total">Total: &pound;0.00</p>

                <button class="cart__checkout-btn" onclick="alert('Checkout coming soon!')">
                    Proceed to Checkout
                </button>
                <div style="clear:both"></div>

                <p style="margin-top:1rem;text-align:right">
                    <a href="index.html#products" style="color:var(--text-light)">&larr; Continue Shopping</a>
                </p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 MEGA Caps &bull; megacaps.co.uk</p>
            <p style="margin-top: 0.5rem; font-size: 0.85rem;">
                <a href="about.html">About</a> &bull;
                <a href="https://instagram.com/megacaps" target="_blank" rel="noopener">Instagram</a> &bull;
                <a href="https://x.com/megacaps" target="_blank" rel="noopener">X</a>
            </p>
        </div>
    </footer>

    <script src="js/shop.js"></script>
</body>
</html>
